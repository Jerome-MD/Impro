<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Impro du jour</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a1e26"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#1a1e26;--panel:#242a35;--ink:#f4efe3;--mute:#98a1b0;--felt:#b5352c;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.35 var(--sans)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;gap:12px;align-items:center;padding:8px 20px;color:var(--mute);border-bottom:3px solid var(--felt)}
header div{flex:1}header #date{color:var(--ink);text-transform:capitalize}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid #3a4352;border-radius:10px;min-height:48px;padding:0 18px}
button.on,button.pri{background:var(--felt);border-color:var(--felt)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px;align-content:start}
.c{background:var(--panel);border-radius:12px;padding:8px 14px 12px;grid-column:span 2}
.c.w{grid-column:1/-1;background:none;padding:0}
.lab{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:15px;min-height:30px}
.lk{min-height:44px;min-width:44px;padding:0;border:0;background:none}
.val{font:600 30px/1.2 var(--serif)}.sm{font-size:22px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.k{background:var(--ink);color:var(--bg);font:600 clamp(30px,6vw,56px) var(--serif);text-align:center;padding:16px 4px 26px;border-radius:3px 3px 12px 12px}
.rh{display:flex;gap:4px;margin-top:8px;align-items:center}
.rh b{width:26px;height:26px;border:2px solid var(--mute);border-radius:4px}.rh b.x{background:var(--ink);border-color:var(--ink)}.rh i{width:14px}
.sig{display:flex;align-items:center;gap:14px;margin-top:4px}.tp{display:flex;gap:10px;align-items:center}.tp button{min-width:48px;padding:0}
footer{display:flex;gap:12px;padding:10px 20px 14px}footer button{flex:1;font-size:20px}
dialog{background:var(--panel);color:var(--ink);border:1px solid #3a4352;border-radius:14px;max-width:560px;width:92%}dialog::backdrop{background:#000a}
select{font:inherit;min-height:44px}.fl{display:inline-block;border:1px solid #3a4352;border-radius:10px;padding:10px 18px}
@media(max-width:700px){.val{font-size:24px}.c{grid-column:1/-1}}
</style></head><body>
<header><div><span id="date"></span></div><span id="cnt"></span><button id="bHist">Historique</button><button id="bSet">Réglages</button></header>
<main></main>
<footer><button id="bRe">Retirer</button><button id="bMet">Métronome</button><button id="bTim"></button><button id="bDone"></button></footer>
<dialog></dialog>
<script type="module" src="app.js"></script></body></html>
